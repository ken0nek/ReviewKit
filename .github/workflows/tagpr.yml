name: tagpr

on:
  push:
    branches: [main]

# tagpr opens and updates the release PR, writes CHANGELOG.md, and on merge pushes
# the tag and creates the GitHub Release.
jobs:
  tagpr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: Songmu/tagpr@047aec4b6c0ce166f52958b5a97f5a3d927fd65b # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
